<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#07090F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CareWidget">
<title>Care Widget</title>
<link rel="manifest" href="./widget-manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --bg:       #07090F;
  --surface:  #0C1120;
  --cyan:     #00E5FF;
  --cyan-dim: rgba(0,229,255,0.10);
  --cyan-glow:rgba(0,229,255,0.35);
  --ink:      #FFFFFF;
  --ink-soft: #A8CBEE;
  --ink-muted:#5E88AD;
  --border-hi:rgba(0,229,255,0.30);
  --success:  #00E676;
  --warn:     #FFB300;
  --feed:     #FF6D3B;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--bg);color:var(--ink);
  font-family:'Share Tech Mono',monospace;
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,.012) 2px,rgba(0,229,255,.012) 4px)
}

.widget {
  width: min(300px, 88vw);
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: 18px;
  padding: 24px 22px 20px;
  box-shadow: 0 0 48px rgba(0,229,255,.10), 0 8px 32px rgba(0,0,0,.6);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.w-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: .78rem;
  color: var(--cyan);
  letter-spacing: .14em;
  text-align: center;
  text-shadow: 0 0 18px var(--cyan-glow);
}

.action-btn {
  width: 100%;
  padding: 22px 16px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.4rem;
  letter-spacing: .22em;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all .2s;
  text-transform: uppercase;
  line-height: 1;
}
.action-btn.start {
  background: var(--cyan);
  color: var(--bg);
  box-shadow: 0 0 36px var(--cyan-glow);
}
.action-btn.start:active { opacity: .88; transform: scale(.97); }

.action-btn.running {
  background: transparent;
  color: var(--success);
  border: 2px solid var(--success);
  box-shadow: 0 0 28px rgba(0,230,118,.18);
  font-size: 1.1rem;
  letter-spacing: .18em;
}
.action-btn.running:active { opacity: .88; }

.divider { height: 1px; background: rgba(0,229,255,.12); }

.next-section {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.next-label {
  font-size: .62rem;
  color: var(--ink-muted);
  letter-spacing: .16em;
  text-transform: uppercase;
}
.next-name {
  font-family: 'Orbitron', sans-serif;
  font-size: .88rem;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.next-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.next-time { font-size: .75rem; color: var(--ink-soft); }
.next-countdown {
  font-family: 'Orbitron', sans-serif;
  font-size: .92rem;
  font-weight: 700;
  color: var(--cyan);
  text-shadow: 0 0 10px var(--cyan-glow);
}
.next-countdown.now  { color: var(--feed); text-shadow: none; }
.next-countdown.soon { color: var(--warn); text-shadow: none; }

.idle-hint {
  font-size: .73rem;
  color: var(--ink-muted);
  text-align: center;
  line-height: 1.6;
}

.open-link {
  display: block;
  text-align: center;
  font-size: .62rem;
  color: var(--ink-muted);
  text-decoration: none;
  letter-spacing: .08em;
}
.open-link:hover { color: var(--ink-soft); }
</style>
</head>
<body>

<div class="widget">

  <div class="w-title">CARE MANAGEMENT SYSTEM</div>

  <button id="action-btn" class="action-btn start">START</button>

  <div class="divider" id="task-divider" style="display:none"></div>

  <div class="next-section" id="next-section" style="display:none">
    <div class="next-label">&#9654; Next Up</div>
    <div class="next-name"><span id="next-emoji"></span>&nbsp;<span id="next-name-text">—</span></div>
    <div class="next-row">
      <div class="next-time" id="next-time">—</div>
      <div class="next-countdown" id="next-countdown">—</div>
    </div>
  </div>

  <div class="idle-hint" id="idle-hint">Tap START to launch<br>today's care schedule</div>

  <a class="open-link" href="./index.html">OPEN FULL APP &nearr;</a>

</div>

<script>
const SCHEDULE_KEY = 'careSystemSchedule_v1';

function fmtTime(d) {
  let h = d.getHours(), m = d.getMinutes(), a = 'AM';
  if (h >= 12) { a = 'PM'; if (h > 12) h -= 12; }
  if (h === 0) h = 12;
  return h + ':' + String(m).padStart(2,'0') + ' ' + a;
}

function update() {
  const raw = localStorage.getItem(SCHEDULE_KEY);
  const now = new Date();

  if (!raw) { showIdle(); return; }

  try {
    const state = JSON.parse(raw);
    if (!state.running || !state.events) { showIdle(); return; }

    const events = state.events
      .map(ev => ({ ...ev, start: new Date(ev.start), end: new Date(ev.end) }))
      .filter(ev => ev.end > now);

    if (!events.length) { showIdle(); return; }
    showRunning(events[0], now);
  } catch(e) { showIdle(); }
}

function showIdle() {
  const btn = document.getElementById('action-btn');
  btn.textContent = 'START';
  btn.className   = 'action-btn start';
  btn.onclick     = () => { location.href = './index.html?action=start'; };
  document.getElementById('task-divider').style.display  = 'none';
  document.getElementById('next-section').style.display  = 'none';
  document.getElementById('idle-hint').style.display     = 'block';
}

function showRunning(next, now) {
  const btn = document.getElementById('action-btn');
  btn.textContent = 'RUNNING';
  btn.className   = 'action-btn running';
  btn.onclick     = () => { location.href = './index.html'; };

  const minsLeft = Math.round((next.start - now) / 60000);
  let countdown, cls = '';
  if      (minsLeft <= 0)  { countdown = 'NOW';            cls = 'next-countdown now';  }
  else if (minsLeft < 10)  { countdown = minsLeft + 'm';   cls = 'next-countdown soon'; }
  else if (minsLeft < 60)  { countdown = minsLeft + 'm';   cls = 'next-countdown';      }
  else {
    const h = Math.floor(minsLeft/60), m = minsLeft%60;
    countdown = m > 0 ? h+'h '+m+'m' : h+'h';
    cls = 'next-countdown';
  }

  document.getElementById('next-emoji').textContent        = next.emoji || '';
  document.getElementById('next-name-text').textContent    = next.title || '—';
  document.getElementById('next-time').textContent         = fmtTime(next.start);
  const cd = document.getElementById('next-countdown');
  cd.textContent = countdown;
  cd.className   = cls;

  document.getElementById('task-divider').style.display   = 'block';
  document.getElementById('next-section').style.display   = 'flex';
  document.getElementById('idle-hint').style.display      = 'none';
}

// Run on load and refresh every 15 seconds
update();
setInterval(update, 15000);

// Also refresh when tab becomes visible again (user switches back to it)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') update();
});
</script>
</body>
</html>
